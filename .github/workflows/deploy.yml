name: Deploy to Cloudflare Pages

# Builds the site and deploys it (plus the functions/ bundle) to Cloudflare
# Pages on every push to main. The Firebase secrets used by the telemetry
# function live on the Pages project itself and persist across deploys, so
# they are not needed here — only credentials to talk to Cloudflare.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # Call wrangler directly rather than cloudflare/wrangler-action: the action
      # installs its own pinned wrangler into the project, which conflicts with our
      # @cloudflare/workers-types peer range. `npx wrangler@4` installs in isolation.
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name=map-paper --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
