name: Deploy to Cloudflare Pages

# Builds the site and deploys it (plus the functions/ bundle) to Cloudflare
# Pages on every push to main. The Firebase secrets used by the telemetry
# function live on the Pages project itself and persist across deploys, so
# they are not needed here — only credentials to talk to Cloudflare.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=map-paper --branch=main
